<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
<title>Connect</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 500px at 10% 0%, #312e81, #0b1020); color: #e2e8f0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { width: min(460px, 92vw); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 14px; }
  img { width: 56px; height: 56px; } h1 { margin: 0; font-size: 24px; color: #fff; } p { margin: 0; color: #94a3b8; }
  input { height: 46px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #fff; padding: 0 14px; font: inherit; }
  .row { display: flex; gap: 10px; } button { flex: 1; height: 46px; border-radius: 12px; border: 0; font: inherit; font-weight: 650; cursor: pointer; }
  .primary { background: #4f46e5; color: #fff; } .ghost { background: rgba(255,255,255,.08); color: #e2e8f0; } .err { color: #fca5a5; min-height: 1em; }
</style></head>
<body><div class="card">
  <img src="icon.png" alt="" /><h1 id="t">Connect to your server</h1>
  <p>Enter the address of your Rostermark server, for example <b>https://attendance.example.com</b>.</p>
  <input id="url" placeholder="https://" autofocus />
  <div class="err" id="err"></div>
  <div class="row"><button class="ghost" id="kiosk">Open as kiosk</button><button class="primary" id="go">Open dashboard</button></div>
</div>
<script>
  const q = new URLSearchParams(location.search); document.getElementById('err').textContent = q.get('error') || '';
  window.rmDesktop.getServer().then((u) => { if (u) document.getElementById('url').value = u; });
  const go = async (mode) => { const v = document.getElementById('url').value.trim(); const ok = await window.rmDesktop.setServer(/^https?:/.test(v) ? v : 'https://' + v, mode); if (!ok) document.getElementById('err').textContent = 'Enter a valid http(s) address.'; };
  document.getElementById('go').onclick = () => go('app'); document.getElementById('kiosk').onclick = () => go('kiosk');
  document.getElementById('url').onkeydown = (e) => e.key === 'Enter' && go('app');
</script></body></html>
